[supervisord]
nodaemon=true
; Log to stdout so `docker logs` / `kubectl logs` show everything.
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1024x768x24
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
user=root

[program:fluxbox]
command=fluxbox
environment=DISPLAY=:1
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
user=root

[program:x11vnc]
command=x11vnc -display :1 -forever -rfbauth /etc/vncsecret -listen 0.0.0.0 -xkb
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
user=root

[program:noVNC]
command=/usr/bin/websockify --web=/usr/share/novnc/ 3100 localhost:5900
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
user=ankiuser
environment=DISPLAY=:1,HOME=/home/ankiuser

[program:anki]
# -p "User 1" bypasses the Profile Manager dialog on first launch.
# AnkiConnect's web server starts on the profileLoaded hook, so the
# Profile Manager would otherwise block it indefinitely.
# --lang en is required because we seed prefs21.db via the minimal
# ProfileManager API, which doesn't populate meta["defaultLang"].
command=/opt/anki-venv/bin/anki -p "User 1" --lang en
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
user=ankiuser
environment=DISPLAY=:1,HOME=/home/ankiuser,QT_OPENGL=software,QT_QUICK_BACKEND=software,QTWEBENGINE_CHROMIUM_FLAGS="--disable-gpu --disable-software-rasterizer"