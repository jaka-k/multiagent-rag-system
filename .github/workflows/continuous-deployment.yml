name: Deploy to Ekko

on:
  push:
    branches:
      - "**"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}   # JSON array of matched filters
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
              - 'shared/**'

  deploy:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Get ekko app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EKKO_APP_ID }}
          private-key: ${{ secrets.EKKO_APP_PRIVATE_KEY }}
          owner: jaka-k
          repositories: ekko

      - name: Generate image tags
        id: tags
        uses: jaka-k/ekko-gitops-action@v0
        with:
          command: generate-images
          service: ${{ matrix.service }}
          ghToken: ${{ steps.app-token.outputs.token }}
